name: Release

# Builds the release artifacts for a tag and attaches them to a GitHub release.
# It deliberately does NOT publish to PyPI or npm: that needs trusted-publisher credentials and an
# explicit human decision (see docs/ROADMAP-0.2.0.md, Q6).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: wheel + sbom + checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match pyproject version $version"; exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Dependency inventory (SBOM)
        run: python3 scripts/dependency_inventory.py > SBOM.json

      # The full strict release audit (scripts/release.ps1 -> verify_release.py --strict) is a local
      # pre-tag gate: it inspects the built web bundle, which this job does not build. Running a
      # weakened copy here would be worse than not running it at all, so it stays where it is real.

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*
            SBOM.json

  publish:
    name: attach to GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "HCS Neural Foundry ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/dist/* \
            artifacts/SBOM.json
