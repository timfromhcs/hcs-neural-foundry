[project]
name = "hcs-foundry"
version = "0.2.0"
description = "HCS Neural Foundry - local-first neural network design, weight-space research and agent studio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
  { name = "hcsmedia" },
  { name = "timfromhcs" },
]
keywords = ["neural-networks", "weight-space", "training", "onnx", "local-first", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "safetensors>=0.4.5,<1",
]

[project.optional-dependencies]
torch = ["torch>=2.5,<3"]
export = ["onnx>=1.16,<2", "onnxruntime>=1.19,<2"]
mcp = ["mcp>=2.3,<3"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
hcs-foundry = "hcs_foundry.cli.main:main"

[project.urls]
Homepage = "https://github.com/timfromhcs/hcs-neural-foundry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/hcs_foundry"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q --strict-markers"
markers = [
  "heavy: slower end-to-end research workflow (generator training, long runs)",
]
filterwarnings = ["error::UserWarning:hcs_foundry.*"]

[tool.ruff]
line-length = 110
src = ["python"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
